<!--
  Wazuh Security Lab - agent configuration
  Installed as /var/ossec/etc/ossec.conf in the endpoint image.

  WAZUH_MANAGER_ADDRESS is replaced by endpoints/entrypoint.sh with the
  manager hostname (set name of the compose service: wazuh-manager).
-->
<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_ADDRESS</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>security-lab</config-profile>
    <notify_time>10</notify_time>
    <max_time_reconnect_try>60</max_time_reconnect_try>
  </client>

  <!-- FIM: monitor the lab configuration, the endpoint home directory and the
       scenario data directory. Writes and permission changes here generate
       syscheck alerts (FIM drills in lesson 2 and 3). -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>
    <directories check_all="yes" realtime="yes">/etc/labapp</directories>
    <directories check_all="yes" realtime="yes">/home/devuser</directories>
    <directories check_all="yes" realtime="yes">/opt/lab/data</directories>
    <!-- The event log itself must never be processed by FIM. -->
    <ignore>/var/log/security-lab</ignore>
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
    <process_priority>10</process_priority>
    <max_eps>100</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_interval>1h</max_interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Custom teaching baseline. Standard CIS policies are deliberately NOT
       enabled: this container image is too minimal for them to be
       meaningful, and a passing lab baseline does NOT prove CIS compliance.
       The policy file is baked into the image at
       /var/ossec/ruleset/sca/security_lab_baseline.yml. -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>30m</interval>
    <skip_nfs>yes</skip_nfs>
    <policies>
      <policy>security_lab_baseline.yml</policy>
    </policies>
  </sca>

  <!-- Hardware/OS inventory shown in the dashboard. -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- Collect the synthetic JSON events produced by the simulation engine.
       log_format=json makes Wazuh parse every field; the custom rules
       (manager: etc/rules/security_lab_rules.xml) match on those fields. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/security-lab/events.json</location>
  </localfile>
</ossec_config>
